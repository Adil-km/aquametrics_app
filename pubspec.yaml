name: aquametrics
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  dio: ^5.4.0
  provider: ^6.1.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  # Base background color and image
  color: "#FFFFFF"
  image: assets/logo.png
  
  # Base dark mode (iOS & older Androids)
  color_dark: "#121212"
  image_dark: assets/logo.png

  # Android 12+ specific settings
  android_12:
    color: "#FFFFFF"
    image: assets/logo.png
    color_dark: "#121212"
    image_dark: assets/logo_dark.png

  android: true
  ios: true